<!DOCTYPE html> 
<html lang="ar" dir="rtl">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>يعظم انتصارنا بالذي أحبنا</title>

<style>

    :root {
        --primary: #1e3a8a;
        --primary-light: #3b82f6;
        --secondary: #d97706;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.8;
        padding: 20px;
    }

    /* =========================
       Navigation Bar
    ========================= */

    nav {
        max-width: 1100px;
        margin: 0 auto 25px auto;
        padding: 15px 25px;

        background: linear-gradient(
            135deg,
            #1e3a8a 0%,
            #1e1b4b 100%
        );

        color: white;
        border-radius: 14px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 20px;

        box-shadow:
            0 8px 20px rgba(0, 0, 0, 0.12);
    }

    nav h2 {
        color: #fbbf24;
        font-size: 1.5rem;
    }

    nav h3 {
        font-size: 1rem;
        font-weight: normal;
        opacity: 0.9;
        text-align: center;
    }

    #menuBtn {
        border: none;
        background: #fbbf24;
        color: #1e1b4b;

        width: 45px;
        height: 45px;

        border-radius: 10px;

        font-size: 1.5rem;
        cursor: pointer;

        transition: 0.3s;
    }

    #menuBtn:hover {
        transform: scale(1.05);
        background: #f59e0b;
    }

    /* =========================
       Overlay
    ========================= */

    #overlay {
        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        background: rgba(0, 0, 0, 0.55);

        display: none;

        z-index: 999;
    }

    /* =========================
       Popup Menu
    ========================= */

    .popup {
        position: fixed;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        width: min(90%, 500px);

        max-height: 85vh;

        overflow-y: auto;

        background: white;

        padding: 25px;

        border-radius: 18px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.25);

        display: none;

        z-index: 1000;

        text-align: center;
    }

    .popup h2 {
        color: var(--primary);

        margin-bottom: 20px;

        padding-bottom: 10px;

        border-bottom:
            3px solid var(--secondary);
    }

    .popup a {
        display: block;

        text-decoration: none;

        color: var(--primary);

        background: #eff6ff;

        border: 1px solid #bfdbfe;

        padding: 11px;

        margin: 8px 0;

        border-radius: 10px;

        font-weight: bold;

        transition: 0.2s;
    }

    .popup a:hover {
        background: var(--primary);

        color: white;

        transform: translateX(-3px);
    }

    .popup hr {
        border: none;

        border-top:
            1px solid var(--border);

        margin: 18px 0;
    }

    #closeBtn {
        margin-top: 15px;

        padding: 10px 25px;

        border: none;

        border-radius: 10px;

        background: #dc2626;

        color: white;

        font-size: 1rem;

        cursor: pointer;
    }

    #closeBtn:hover {
        background: #b91c1c;
    }

    /* =========================
       Main Container
    ========================= */

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    /* =========================
       Header
    ========================= */

    header {
        text-align: center;

        padding: 40px 20px;

        background:
            linear-gradient(
                135deg,
                #1e3a8a 0%,
                #1e1b4b 100%
            );

        color: white;

        border-radius: 16px;

        margin-bottom: 30px;

        box-shadow:
            0 10px 25px -5px
            rgba(0, 0, 0, 0.1);
    }

    header h1 {
        font-size: 2.2rem;

        margin-bottom: 10px;

        color: #fbbf24;
    }

    header p {
        font-size: 1.1rem;

        opacity: 0.9;
    }

    /* =========================
       Section Titles
    ========================= */

    .section-title {
        display: flex;

        align-items: center;

        gap: 10px;

        font-size: 1.5rem;

        color: var(--primary);

        margin: 30px 0 20px 0;

        padding-bottom: 8px;

        border-bottom:
            3px solid var(--secondary);
    }

    /* =========================
       Grid
    ========================= */

    .grid {
        display: grid;

        grid-template-columns:
            repeat(
                auto-fit,
                minmax(300px, 1fr)
            );

        gap: 20px;

        margin-bottom: 30px;
    }

    /* =========================
       Cards
    ========================= */

    .card {
        background: var(--card-bg);

        border-radius: 12px;

        padding: 24px;

        border:
            1px solid var(--border);

        box-shadow:
            0 4px 6px -1px
            rgba(0, 0, 0, 0.05);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }

    .card:hover {
        transform: translateY(-3px);

        box-shadow:
            0 10px 15px -3px
            rgba(0, 0, 0, 0.1);
    }

    .card h3 {
        color: var(--primary);

        margin-bottom: 12px;

        font-size: 1.2rem;
    }

    .card p {
        color: var(--text-muted);

        font-size: 0.95rem;
    }

    /* =========================
       Badges
    ========================= */

    .badge-container {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;

        margin-top: 10px;
    }

    .badge {
        background-color: #eff6ff;

        color: var(--primary-light);

        padding: 6px 12px;

        border-radius: 20px;

        font-size: 0.85rem;

        font-weight: bold;

        border:
            1px solid #bfdbfe;
    }

    /* =========================
       Quote Box
    ========================= */

    .quote-box {
        background: #fffbeb;

        border-right:
            4px solid var(--secondary);

        padding: 16px;

        border-radius: 8px;

        margin-top: 10px;

        font-style: italic;

        color: #92400e;
    }

    /* =========================
       Footer
    ========================= */

    footer {
        text-align: center;

        padding: 20px;

        color: var(--text-muted);

        font-size: 0.9rem;

        border-top:
            1px solid var(--border);

        margin-top: 40px;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {

        body {
            padding: 12px;
        }

        nav {
            padding: 12px 15px;
        }

        nav h2 {
            font-size: 1.2rem;
        }

        nav h3 {
            font-size: 0.8rem;
        }

        #menuBtn {
            width: 40px;
            height: 40px;
        }

        header {
            padding: 30px 15px;
        }

        header h1 {
            font-size: 1.7rem;
        }

        header p {
            font-size: 1rem;
        }

        .section-title {
            font-size: 1.3rem;
        }

        .grid {
            grid-template-columns: 1fr;
        }

        .card {
            padding: 20px;
        }
    }

    @media (max-width: 450px) {

        nav h3 {
            display: none;
        }

        header h1 {
            font-size: 1.5rem;
        }

        header p {
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.2rem;
        }

        .card h3 {
            font-size: 1.05rem;
        }

        .card p {
            font-size: 0.9rem;
        }

        .popup {
            padding: 20px;

            width: 92%;
        }
    }

</style>
